<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhenTewMeet</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Righteous&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #E8F1FB;
    --ledger-line: #CBDCEE;
    --ink: #23261F;
    --ink-soft: #63665C;
    --forest: #1F5C4A;
    --forest-dark: #164536;
    --gold: #B8862F;
    --continue-blue: #1E4E8C;
    --continue-blue-dark: #163A69;
    --cell-empty: #FFFFFF;
    --cell-selected: #3E8367;
    --cell-selected-hover: #327057;
    --radius: 3px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    padding: clamp(20px, 5vw, 56px) 16px 80px;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
  }

  .masthead {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }

  .masthead h1 {
    font-family: 'Righteous', cursive;
    font-weight: 400;
    font-size: clamp(30px, 5vw, 44px);
    margin: 0;
    letter-spacing: -0.005em;
    line-height: 1.05;
    color: var(--continue-blue-dark);
  }

  .masthead .tagline {
    font-size: 14px;
    color: var(--ink-soft);
    max-width: 30ch;
    line-height: 1.4;
  }

  /* ---- Name step ---- */

  .name-card {
    background: #fff;
    border: 1px solid var(--ledger-line);
    border-radius: 6px;
    padding: 28px;
    margin-bottom: 28px;
  }

  .name-card label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .name-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  input[type="text"] {
    flex: 1 1 240px;
    font-family: inherit;
    font-size: 16px;
    padding: 12px 14px;
    border: 1.5px solid var(--ledger-line);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--forest);
    box-shadow: 0 0 0 3px rgba(31,92,74,0.12);
  }

  button {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    border: none;
    border-radius: var(--radius);
    padding: 12px 22px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button:active {
    transform: scale(0.98);
  }

  .btn-primary {
    background: var(--continue-blue);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--continue-blue-dark);
  }

  .btn-primary:disabled {
    background: #C9C6BC;
    cursor: not-allowed;
  }

  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid var(--ledger-line);
  }

  .btn-ghost:hover {
    border-color: var(--ink-soft);
    color: var(--ink);
  }

  /* ---- Instructions ---- */

  .fill-header-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 18px;
  }

  .instructions {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0;
    line-height: 1.5;
  }

  .instructions strong {
    color: var(--ink);
    font-weight: 600;
  }

  .save-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .save-status.visible {
    opacity: 1;
  }

  .save-status.saved {
    color: var(--forest-dark);
  }

  /* ---- Grid ---- */

  .grid-container {
    display: grid;
    grid-template-columns: auto 1fr;
    row-gap: 3px;
  }

  .grid-box {
    border: 1px solid var(--ledger-line);
    border-radius: 6px;
    background: #fff;
    overflow: hidden;
    min-width: 0;
  }

  .grid-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table.grid {
    border-collapse: collapse;
    width: 100%;
    min-width: 280px;
    user-select: none;
  }

  table.grid th,
  table.grid td {
    border: 1px solid var(--ledger-line);
    padding: 0;
  }

  table.grid thead th {
    background: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-soft);
    height: 34px;
    vertical-align: middle;
    text-align: center;
    letter-spacing: 0.02em;
  }

  /* Time column: plain text sitting beside the grid */

  table.time-table {
    border-collapse: collapse;
  }

  table.time-table th,
  table.time-table td {
    border: none;
    padding: 0 10px 0 0;
  }

  table.time-table thead th {
    height: 34px;
  }

  .time-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    white-space: nowrap;
    text-align: right;
    height: 15px;
    vertical-align: middle;
    box-sizing: border-box;
    transform: translateY(-7px);
  }

  .time-label.hour-mark {
    color: var(--ink);
    font-weight: 500;
  }

  .grid-end-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink);
    font-weight: 500;
    white-space: nowrap;
    text-align: right;
    padding-right: 10px;
    align-self: start;
    transform: translateY(-13px);
  }

  .slot-cell {
    width: 40px;
    height: 15px;
    background: var(--cell-empty);
    cursor: pointer;
    transition: background 0.06s ease;
    box-sizing: border-box;
  }

  .slot-cell.hour-top {
    border-top: 1px solid var(--ledger-line);
  }

  .slot-cell:hover {
    background: #EDEAE2;
  }

  .slot-cell.selected {
    background: var(--cell-selected);
  }

  .slot-cell.selected:hover {
    background: var(--cell-selected-hover);
  }

  .submit-row {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .hidden {
    display: none !important;
  }

  /* ---- Admin / results view ---- */

  .legend {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }

  .legend-scale {
    display: flex;
    height: 12px;
    width: 100px;
    border-radius: 2px;
    overflow: hidden;
    border: 1px solid var(--ledger-line);
  }

  .legend-scale span {
    flex: 1;
  }

  .tooltip {
    position: fixed;
    background: var(--ink);
    color: #fff;
    font-size: 12.5px;
    padding: 8px 11px;
    border-radius: 4px;
    pointer-events: none;
    max-width: 220px;
    line-height: 1.4;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.1s ease;
  }

  .tooltip.show {
    opacity: 1;
  }

  .summary-strip {
    display: flex;
    gap: 24px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .summary-strip .stat {
    font-family: 'IBM Plex Mono', monospace;
  }

  .summary-strip .stat .n {
    font-size: 22px;
    color: var(--forest-dark);
    font-weight: 500;
  }

  .summary-strip .stat .label {
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .loading {
    padding: 60px 0;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }
</style>
</head>

<body>
<div class="wrap">

  <div class="masthead">
    <h1 id="pageTitle">WhenTewMeet</h1>
  </div>

  <!-- STEP 1: name -->
  <div class="name-card hidden" id="nameStep">
    <label for="nameInput">Name</label>
    <div class="name-row">
      <input type="text" id="nameInput" autocomplete="name">
      <button class="btn-primary" id="startBtn">Continue</button>
    </div>
  </div>

  <!-- STEP 2: grid (fill mode) -->
  <div id="fillStep" class="hidden">
    <div class="fill-header-row">
      <p class="instructions">
        Click and drag across boxes to mark yourself
        <strong>free</strong> during that time.
        Click a marked box to clear it.
      </p>
      <span class="save-status" id="saveStatus"></span>
    </div>

    <div class="grid-container">
      <table class="time-table" id="fillTimes"></table>

      <div class="grid-box">
        <div class="grid-scroll">
          <table class="grid" id="fillGrid"></table>
        </div>
      </div>

      <div class="grid-end-label" id="fillEndLabel"></div>
    </div>

    <div class="submit-row">
      <button class="btn-ghost" id="backBtn">Change name</button>
    </div>
  </div>

  <!-- ADMIN: results view -->
  <div id="adminStep" class="hidden">

    <div class="summary-strip" id="summaryStrip"></div>

    <div class="legend">
      <span id="legendMin">0 Free</span>

      <span class="legend-scale">
        <span id="legend1"></span>
        <span id="legend2"></span>
        <span id="legend3"></span>
        <span id="legend4"></span>
        <span id="legend5"></span>
      </span>

      <span id="legendMax">0 Free</span>
    </div>

    <div class="grid-container">
      <table class="time-table" id="adminTimes"></table>

      <div class="grid-box">
        <div class="grid-scroll">
          <table class="grid" id="adminGrid"></table>
        </div>
      </div>

      <div class="grid-end-label" id="adminEndLabel"></div>
    </div>
  </div>

  <div id="loadingStep" class="loading hidden">
    Loading…
  </div>

</div>

<div class="tooltip" id="tooltip"></div>

<script>
/* ============================================================
   CONFIGURATION — edit these two lines for your club
   ============================================================ */

const DOC_NAME = "WhenTewMeet";

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxD5woBVEXURO47az6ZRDSMbZhBQJ4rEdbOmTK0yUa_9RWEIfFOjV_0-CcBWFQkPZj_JQ/exec";


/* ============================================================
   Time / day setup — 9:00 AM to 10:00 PM, 30-min blocks
   ============================================================ */

const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

const START_HOUR = 9;
const END_HOUR = 22;

const SLOTS_PER_DAY =
  (END_HOUR - START_HOUR) * 2; // 26


function slotLabel(i) {
  const totalMin =
    START_HOUR * 60 + i * 30;

  let h = Math.floor(totalMin / 60);
  const m = totalMin % 60;

  const ampm = h >= 12 ? "PM" : "AM";

  let h12 = h % 12;

  if (h12 === 0) {
    h12 = 12;
  }

  return `${h12}:${m === 0 ? "00" : m} ${ampm}`;
}


function slotKey(day, i) {
  return day + "_" + i;
}


const END_LABEL =
  slotLabel(SLOTS_PER_DAY);


/* ============================================================
   Build the fill-in grid
   ============================================================ */

const selected = new Set();

let dragMode = null;


function buildFillGrid() {

  const timesTable =
    document.getElementById("fillTimes");

  const grid =
    document.getElementById("fillGrid");


  let timesHtml =
    "<thead><tr><th></th></tr></thead><tbody>";


  for (
    let i = 0;
    i < SLOTS_PER_DAY;
    i++
  ) {

    const isHour =
      i % 2 === 0;

    timesHtml += `
      <tr>
        <td class="time-label ${isHour ? "hour-mark hour-top" : ""}">
          ${isHour ? slotLabel(i) : ""}
        </td>
      </tr>
    `;
  }


  timesHtml += "</tbody>";

  timesTable.innerHTML =
    timesHtml;


  document.getElementById(
    "fillEndLabel"
  ).textContent = END_LABEL;


  let html =
    "<thead><tr>";


  DAYS.forEach(d => {
    html += `<th>${d}</th>`;
  });


  html +=
    "</tr></thead><tbody>";


  for (
    let i = 0;
    i < SLOTS_PER_DAY;
    i++
  ) {

    const isHour =
      i % 2 === 0;

    html += "<tr>";


    DAYS.forEach(d => {

      const key =
        slotKey(d, i);

      html += `
        <td
          class="slot-cell ${isHour ? "hour-top" : ""}"
          data-key="${key}"
        ></td>
      `;
    });


    html += "</tr>";
  }


  html +=
    "</tbody>";


  grid.innerHTML =
    html;


  const cells =
    grid.querySelectorAll(
      ".slot-cell"
    );


  let isDragging = false;


  function toggle(
    cell,
    forceState
  ) {

    const key =
      cell.dataset.key;

    const shouldSelect =
      forceState !== undefined
        ? forceState
        : !selected.has(key);


    if (shouldSelect) {

      selected.add(key);

      cell.classList.add(
        "selected"
      );

    } else {

      selected.delete(key);

      cell.classList.remove(
        "selected"
      );
    }


    scheduleSave();
  }


  cells.forEach(cell => {

    cell.addEventListener(
      "mousedown",
      e => {

        e.preventDefault();

        isDragging = true;

        dragMode =
          !selected.has(
            cell.dataset.key
          );

        toggle(
          cell,
          dragMode
        );
      }
    );


    cell.addEventListener(
      "mouseenter",
      () => {

        if (isDragging) {
          toggle(
            cell,
            dragMode
          );
        }
      }
    );


    cell.addEventListener(
      "touchstart",
      e => {

        e.preventDefault();

        isDragging = true;

        dragMode =
          !selected.has(
            cell.dataset.key
          );

        toggle(
          cell,
          dragMode
        );

      },
      { passive: false }
    );


    cell.addEventListener(
      "touchmove",
      e => {

        e.preventDefault();

        const t =
          e.touches[0];

        const el =
          document.elementFromPoint(
            t.clientX,
            t.clientY
          );

        if (
          el &&
          el.classList.contains(
            "slot-cell"
          )
        ) {

          toggle(
            el,
            dragMode
          );
        }

      },
      { passive: false }
    );

  });


  document.addEventListener(
    "mouseup",
    () => {
      isDragging = false;
    }
  );


  document.addEventListener(
    "touchend",
    () => {
      isDragging = false;
    }
  );
}


/* ============================================================
   Autosave — debounced
   ============================================================ */

let saveTimer = null;


const saveStatusEl = () =>
  document.getElementById(
    "saveStatus"
  );


function scheduleSave() {

  const el =
    saveStatusEl();

  el.textContent =
    "Saving…";

  el.classList.remove(
    "saved"
  );

  el.classList.add(
    "visible"
  );


  clearTimeout(
    saveTimer
  );


  saveTimer =
    setTimeout(
      commitSave,
      500
    );
}


async function commitSave() {

  const el =
    saveStatusEl();


  try {

    await fetch(
      SCRIPT_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          name: currentName,
          slots:
            Array.from(selected)
        })
      }
    );


    el.textContent =
      "Saved";

    el.classList.add(
      "saved"
    );


  } catch (err) {

    console.error(
      "Save error:",
      err
    );

    el.textContent =
      "Couldn't save — check connection";

    el.classList.remove(
      "saved"
    );
  }
}


/* ============================================================
   Step navigation
   ============================================================ */

let currentName = "";


document.getElementById(
  "startBtn"
).addEventListener(
  "click",
  async () => {

    const val =
      document.getElementById(
        "nameInput"
      ).value.trim();


    if (!val) {

      document.getElementById(
        "nameInput"
      ).focus();

      return;
    }


    currentName =
      val;


    const btn =
      document.getElementById(
        "startBtn"
      );


    btn.disabled = true;

    btn.textContent =
      "Loading…";


    await loadExisting(
      currentName
    );


    btn.disabled = false;

    btn.textContent =
      "Continue";


    document.getElementById(
      "nameStep"
    ).classList.add(
      "hidden"
    );


    document.getElementById(
      "fillStep"
    ).classList.remove(
      "hidden"
    );
  }
);


/* ============================================================
   Load existing response
   ============================================================ */

async function loadExisting(name) {

  selected.clear();


  document
    .querySelectorAll(
      "#fillGrid .slot-cell.selected"
    )
    .forEach(c =>
      c.classList.remove(
        "selected"
      )
    );


  const statusEl =
    saveStatusEl();


  statusEl.classList.remove(
    "visible",
    "saved"
  );


  try {

    const res =
      await fetch(
        `${SCRIPT_URL}?name=${encodeURIComponent(name)}`
      );


    const data =
      await res.json();


    if (
      data &&
      data.found &&
      Array.isArray(data.slots)
    ) {

      data.slots.forEach(
        key => {

          selected.add(
            key
          );


          const cell =
            document.querySelector(
              `#fillGrid .slot-cell[data-key="${CSS.escape(key)}"]`
            );


          if (cell) {

            cell.classList.add(
              "selected"
            );
          }
        }
      );
    }


  } catch (err) {

    console.error(
      "Lookup error:",
      err
    );

  }
}


/* ============================================================
   Back button
   ============================================================ */

document.getElementById(
  "backBtn"
).addEventListener(
  "click",
  () => {

    document.getElementById(
      "fillStep"
    ).classList.add(
      "hidden"
    );


    document.getElementById(
      "nameStep"
    ).classList.remove(
      "hidden"
    );
  }
);


/* ============================================================
   ADMIN RESULTS VIEW
   ============================================================ */

function buildAdminGrid(
  responses
) {

  const counts = {};

  const namesBySlot = {};


  /* Initialize every slot */

  DAYS.forEach(d => {

    for (
      let i = 0;
      i < SLOTS_PER_DAY;
      i++
    ) {

      const key =
        slotKey(d, i);

      counts[key] = 0;

      namesBySlot[key] = [];
    }
  });


  /* Count availability */

  responses.forEach(r => {

    (r.slots || []).forEach(
      key => {

        if (
          counts[key] !== undefined
        ) {

          counts[key]++;

          namesBySlot[key].push(
            r.name
          );
        }
      }
    );
  });


  /*
  Find the minimum and maximum availability
  across all slots, including zero.
  */

  const allCounts =
    Object.values(counts);

  const minCount =
    allCounts.length
      ? Math.min(...allCounts)
      : 0;

  const maxCount =
    allCounts.length
      ? Math.max(...allCounts)
      : 0;


  /* ==========================================================
     Time labels
     ========================================================== */

  const timesTable =
    document.getElementById(
      "adminTimes"
    );


  const table =
    document.getElementById(
      "adminGrid"
    );


  let timesHtml =
    "<thead><tr><th></th></tr></thead><tbody>";


  for (
    let i = 0;
    i < SLOTS_PER_DAY;
    i++
  ) {

    const isHour =
      i % 2 === 0;


    timesHtml += `
      <tr>
        <td class="time-label ${isHour ? "hour-mark hour-top" : ""}">
          ${isHour ? slotLabel(i) : ""}
        </td>
      </tr>
    `;
  }


  timesHtml +=
    "</tbody>";


  timesTable.innerHTML =
    timesHtml;


  /* ==========================================================
     Build heat map
     ========================================================== */

  let html =
    "<thead><tr>";


  DAYS.forEach(d => {

    html +=
      `<th>${d}</th>`;
  });


  html +=
    "</tr></thead><tbody>";


  for (
    let i = 0;
    i < SLOTS_PER_DAY;
    i++
  ) {

    const isHour =
      i % 2 === 0;


    html += "<tr>";


    DAYS.forEach(d => {

      const key =
        slotKey(d, i);


      const n =
        counts[key];


      /*
        IMPORTANT:
        Pass the actual number of
        available people into heatColor.
      */

      const color =
        heatColor(
          n,
          minCount,
          maxCount
        );


      html += `
        <td
          class="slot-cell ${isHour ? "hour-top" : ""}"
          style="background:${color}"
          data-key="${key}"
          data-count="${n}"
        ></td>
      `;
    });


    html += "</tr>";
  }


  html +=
    "</tbody>";


  table.innerHTML =
    html;


  /* ==========================================================
     Summary
     ========================================================== */

  const strip =
    document.getElementById(
      "summaryStrip"
    );


  strip.innerHTML = `
    <div class="stat">
      <div class="n">
        ${responses.length}
      </div>

      <div class="label">
        Responses
      </div>
    </div>
  `;


  /* ==========================================================
   Dynamic legend
   ========================================================== */

  const legendMin =
    document.getElementById(
      "legendMin"
    );

  const legendMax =
    document.getElementById(
      "legendMax"
    );

  legendMin.textContent =
    `${minCount}/${responses.length} Free`;

  legendMax.textContent =
    `${maxCount}/${responses.length} Free`;


  /*
    Make the five legend blocks correspond
    evenly to the actual availability range.
  */

  const legendColors = [
    heatColor(minCount, minCount, maxCount),
    heatColor(
      minCount + (maxCount - minCount) * 0.25,
      minCount,
      maxCount
    ),
    heatColor(
      minCount + (maxCount - minCount) * 0.50,
      minCount,
      maxCount
    ),
    heatColor(
      minCount + (maxCount - minCount) * 0.75,
      minCount,
      maxCount
    ),
    heatColor(
      maxCount,
      minCount,
      maxCount
    )
  ];

  document.getElementById(
    "legend1"
  ).style.background =
    legendColors[0];

  document.getElementById(
    "legend2"
  ).style.background =
    legendColors[1];

  document.getElementById(
    "legend3"
  ).style.background =
    legendColors[2];

  document.getElementById(
    "legend4"
  ).style.background =
    legendColors[3];

  document.getElementById(
    "legend5"
  ).style.background =
    legendColors[4];


  /* ==========================================================
     Tooltips
     ========================================================== */

  const tooltip =
    document.getElementById(
      "tooltip"
    );


  table
    .querySelectorAll(
      ".slot-cell"
    )
    .forEach(cell => {

      cell.addEventListener(
        "mousemove",
        e => {

          const key =
            cell.dataset.key;


          const names =
            namesBySlot[key];


          if (!names.length) {

            tooltip.classList.remove(
              "show"
            );

            return;
          }


          tooltip.textContent =
            `${names.length} free: ${names.join(", ")}`;


          tooltip.style.left =
            (e.clientX + 14) +
            "px";


          tooltip.style.top =
            (e.clientY + 14) +
            "px";


          tooltip.classList.add(
            "show"
          );
        }
      );


      cell.addEventListener(
        "mouseleave",
        () => {

          tooltip.classList.remove(
            "show"
          );
        }
      );

    });
}


/* ============================================================
   Heat map color function
   ============================================================ */

function heatColor(count, minCount, maxCount) {

  // Minimum availability is always white.
  if (count === minCount) {
    return "#FFFFFF";
  }

  // If there is only one availability level,
  // it is the minimum, so use white.
  if (maxCount === minCount) {
    return "#FFFFFF";
  }

  // Scale from:
  // minCount -> white
  // maxCount -> darkest green
  const pct =
    (count - minCount) /
    (maxCount - minCount);

  const stops = [
    [255, 255, 255], // white
    [205, 225, 216], // light green
    [143, 188, 169],
    [75, 139, 114],
    [31, 92, 74]     // darkest green
  ];

  const scaled =
    pct * (stops.length - 1);

  const idx =
    Math.min(
      Math.floor(scaled),
      stops.length - 2
    );

  const frac =
    scaled - idx;

  const a = stops[idx];
  const b = stops[idx + 1];

  const rgb = a.map((v, i) =>
    Math.round(
      v + (b[i] - v) * frac
    )
  );

  return `rgb(${rgb.join(",")})`;
}


/* ============================================================
   ENTRY POINT
   ============================================================ */

async function init() {

  document.title =
    DOC_NAME;


  document.getElementById(
    "pageTitle"
  ).textContent =
    DOC_NAME;


  const params =
    new URLSearchParams(
      window.location.search
    );


  const code =
    params.get("admin");


  /*
    IMPORTANT:
    Hide all views first.

    This prevents the name box from
    flashing/showing in admin mode.
  */

  document.getElementById(
    "nameStep"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "fillStep"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "adminStep"
  ).classList.add(
    "hidden"
  );


  /*
    ADMIN MODE

    If ?admin= exists, NEVER fall
    back to the normal name form.
  */

  if (
    code !== null
  ) {

    document.getElementById(
      "loadingStep"
    ).classList.remove(
      "hidden"
    );


    try {

      const res =
        await fetch(
          `${SCRIPT_URL}?code=${encodeURIComponent(code)}`
        );


      const data =
        await res.json();


      document.getElementById(
        "loadingStep"
      ).classList.add(
        "hidden"
      );


      if (
        Array.isArray(data)
      ) {

        document.getElementById(
          "adminStep"
        ).classList.remove(
          "hidden"
        );


        buildAdminGrid(
          data
        );


        return;
      }


      /*
        Admin parameter was provided,
        but the code was invalid.
      */

      document.getElementById(
        "loadingStep"
      ).textContent =
        "Invalid admin code.";


      document.getElementById(
        "loadingStep"
      ).classList.remove(
        "hidden"
      );


      return;


    } catch (err) {

      console.error(
        "Admin load error:",
        err
      );


      document.getElementById(
        "loadingStep"
      ).textContent =
        "Couldn't load admin results.";


      document.getElementById(
        "loadingStep"
      ).classList.remove(
        "hidden"
      );


      return;
    }
  }


  /*
    NORMAL MEMBER MODE
  */

  buildFillGrid();


  document.getElementById(
    "nameStep"
  ).classList.remove(
    "hidden"
  );
}


init();
</script>
